<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S.O.S. Cosmik — Salle</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="stars"></div>

<div id="app" class="app">

  <!-- Vue Connexion -->
  <section id="view-connecting" class="view">
    <div class="end-card">
      <h1>Connexion...</h1>
      <p id="connecting-msg" class="hint">Connexion à la salle en cours...</p>
    </div>
  </section>

  <!-- Vue Salle d'attente -->
  <section id="view-waiting" class="view hidden">
    <header class="room-header">
      <h1>Salle <span id="room-code-label"></span></h1>
      <button id="copy-code-btn" class="btn btn-ghost">Copier le code</button>
    </header>
    <p class="hint" id="waiting-hint">En attente que l'administrateur lance la partie...</p>
    <div class="player-list" id="waiting-player-list"></div>
    <p class="error" id="start-error"></p>
    <button id="start-btn" class="btn btn-primary hidden">🚀 Lancer la partie</button>
    <p class="hint small" id="min-players-hint"></p>
  </section>

  <!-- Vue Jeu -->
  <section id="view-game" class="view hidden">
    <header class="game-header">
      <div class="room-pill">Salle <strong id="game-room-code"></strong></div>
      <div class="engine-meter">
        <div class="meter-label">Moteur <span id="energy-label">0 / 30</span> ⚡</div>
        <div class="meter-bar"><div id="energy-fill" class="meter-fill"></div></div>
      </div>
      <div class="deck-pill"><span class="card-back-mini"></span> Pioche : <strong id="deck-count">0</strong></div>
    </header>

    <div class="turn-banner" id="turn-banner"></div>

    <div class="board">
      <div class="players-strip" id="players-strip"></div>

      <div class="main-stage">
        <div class="last-action-panel" id="last-action-panel">
          <p class="hint">En attente de la première action...</p>
        </div>

        <div class="hand-area">
          <h3>Ta main</h3>
          <div class="hand" id="hand"></div>
          <div class="action-bar" id="action-bar"></div>
          <p class="error" id="action-error"></p>
        </div>
      </div>

      <aside class="log-sidebar">
        <h3>Journal</h3>
        <ul id="log-list"></ul>
      </aside>
    </div>
  </section>

  <!-- Vue Fin de partie -->
  <section id="view-ended" class="view hidden">
    <div class="end-card">
      <h1 id="end-title"></h1>
      <p id="end-reason"></p>
      <div id="end-winners" class="winners-list"></div>
      <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
    </div>
  </section>

  <section id="view-error" class="view hidden">
    <div class="end-card">
      <h1>Oups</h1>
      <p id="global-error"></p>
      <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
    </div>
  </section>

</div>

<!-- Modale de sélection de cible -->
<div id="target-modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="target-modal-title">Choisis une cible</h3>
    <div id="target-list" class="target-list"></div>
    <button id="target-cancel" class="btn btn-ghost">Annuler</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/game.js"></script>
</body>
</html>
